name: release

# A tag is the release. `scripts/build.ts` bakes the tag into the binaries, so
# nothing else has to be edited, remembered, or kept in step to cut one:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# A tag with a hyphen in it (v0.2.0-rc.1) publishes as a pre-release and is
# kept out of the Homebrew tap, so trying something out cannot become what
# `brew upgrade` hands to everyone.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.14"

jobs:
  build:
    name: build every platform
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci

      - name: install bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: read the tag
        id: meta
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "building harv $version (prerelease=$prerelease)"

      # A tag is not a reason to skip the checks; it is the last chance to run
      # them before the artifact has a URL people can install from.
      - run: npm run typecheck
      - run: npm test

      - name: cache the vendored mise
        uses: actions/cache@v4
        with:
          path: vendor/mise
          key: mise-${{ runner.os }}-${{ hashFiles('vendor/mise.lock.json') }}

      # Bun cross-compiles, so four platforms come off one runner and the
      # matrix below is free to be about installing rather than building.
      - name: build
        run: bun scripts/build.ts --version "${{ steps.meta.outputs.version }}" --all

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          retention-days: 7

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: write the release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          {
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh"
            echo '```'
            echo
            echo "Or download the archive for your platform below and put \`harv\` on your PATH."
            echo "Each binary carries its own runtime — no Node, no Bun — and the pinned mise it needs."
            echo
            echo "## Verifying a download"
            echo
            echo '```sh'
            echo "shasum -a 256 -c checksums.txt --ignore-missing"
            echo '```'
            echo
            echo '### Checksums'
            echo
            echo '```'
            cat dist/checksums.txt
            echo '```'
          } > notes.md

      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          flags=""
          if [ "${{ needs.build.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          # install.sh ships with the release so an install can be pinned to a
          # version whole — script and binaries from the same commit.
          gh release create "$GITHUB_REF_NAME" \
            --title "harv $VERSION" \
            --notes-file notes.md \
            $flags \
            dist/*.tar.gz \
            dist/checksums.txt \
            dist/harv.rb \
            install.sh

  verify:
    name: install on a clean ${{ matrix.platform }}
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-x64 }
          - { runner: ubuntu-latest, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      # No checkout: a clean machine has the repo's install script and nothing
      # else, so that is all this job is allowed to use.
      - name: install harv the way the README says to
        env:
          HARV_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eux
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh" \
            | HARV_INSTALL_DIR="$HOME/.harv-bin" sh

      - name: it is the version that was just published
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          out=$(HARV_NO_UPDATE_CHECK=1 "$HOME/.harv-bin/harv" --version)
          echo "$out"
          echo "$out" | grep -qx "harv ${VERSION} (${{ matrix.platform }})"

      - name: it needs no runtime — nothing on PATH but the system's own
        run: |
          set -eu
          # The check is only worth anything if the stripped PATH really has
          # neither, so that is asserted first rather than assumed.
          if env -i PATH=/usr/bin:/bin sh -c 'command -v node || command -v bun'; then
            echo "node or bun is in /usr/bin — this check cannot prove anything here" >&2
            exit 1
          fi
          env -i HOME="$HOME" PATH=/usr/bin:/bin HARV_NO_UPDATE_CHECK=1 "$HOME/.harv-bin/harv" --version

      - name: the vendored mise is inside it and runs
        run: |
          set -eu
          claimed=$(HARV_NO_UPDATE_CHECK=1 "$HOME/.harv-bin/harv" --version | sed -n 's/^vendored mise //p')
          test -n "$claimed"
          # `harv mise` unpacks the embedded engine and execs it. Its own answer
          # has to match what harv said it was carrying.
          "$HOME/.harv-bin/harv" mise --version | grep -q "^${claimed} "
          echo "vendored mise ${claimed} runs on ${{ matrix.platform }}"

  homebrew:
    name: update the Homebrew tap
    needs: [build, publish, verify]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      # The tap is a second repository, so pushing to it needs a token this one
      # does not have by default. Without it the formula is still attached to
      # the release and installable by hand — the release does not fail over a
      # distribution channel that has not been set up.
      - name: push the formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'bonyadnouri/homebrew-harv' }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice title=Homebrew tap not updated::HOMEBREW_TAP_TOKEN is not set. harv.rb is attached to the release; see docs/adr/0009 for setting the tap up."
            exit 0
          fi

          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp dist/harv.rb tap/Formula/harv.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "the tap already has harv $VERSION"
            exit 0
          fi
          git commit -am "harv $VERSION"
          git push
