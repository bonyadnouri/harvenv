name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, because the compiler is part of what a release is (ADR 0007).
  BUN_VERSION: "1.3.14"

jobs:
  test:
    name: typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The floor `package.json` promises, not the newest node — if harv needs
      # more than it claims, this is where that should hurt.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.18"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The one acceptance check that needs neither a `claude` binary nor the
      # network: real git repositories, a real Store, and the guarantees the
      # Manifest-only CI recipe rests on — byte-identical reproduction from a
      # Lockfile, no re-fetch for content the Store already holds, and a loud
      # failure when a fetch does not match its pin.
      - name: the Store's own guarantees
        run: node scripts/verify-sync-store.ts

      # The other one that needs no `claude`: Doctor's own acceptance criteria.
      # Two of its failure classes are facts about a session — a launch recipe
      # that regressed, a server waiting on auth — so it scripts them with a
      # stand-in `claude` that emits the init event it is told to. A regression
      # nobody can produce on demand becomes a fixture, and "Doctor would catch
      # it" stops being a claim.
      - name: harv doctor catches what it says it catches
        run: node scripts/verify-doctor.ts

      # install.sh is piped into a shell on machines that have nothing else.
      - name: shellcheck install.sh
        run: shellcheck install.sh

  build:
    name: build a binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci

      - name: install bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: cache the vendored mise
        uses: actions/cache@v6
        with:
          path: vendor/mise
          key: mise-${{ runner.os }}-${{ hashFiles('vendor/mise.lock.json') }}

      # Not to publish anything — to find out on the pull request, rather than
      # on the tag, that the generated entry point or the embedding broke.
      - run: bun scripts/build.ts

      - name: the binary answers for itself
        run: |
          set -eux
          BIN=build/linux-x64/stage/harv
          "$BIN" --version | tee /dev/stderr | grep -q '^harv 0\.0\.0-dev'
          "$BIN" mise --version
